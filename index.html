<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="navbar">
    <div class="logo">Campus<span>Hub</span></div>
    <nav>
      <a href="#" class="active" data-page="home">Home</a>
      <a href="#" data-page="courses">Courses</a>
      <a href="#" data-page="contact">Contact</a>
    </nav>
    <label class="switch">
      <span>Dark mode</span>
      <input type="checkbox" id="darkToggle">
      <span class="slider"></span>
    </label>
  </header>

  <main>
    <section class="card page" id="home">
      <div class="avatar">RJ</div>
      <h1>Riel Jan O. Cubillas</h1>
      <p class="course">BS Information Technology, 2nd Year</p>
      <div class="tags">
        <span>HTML</span><span>CSS</span><span>JavaScript</span>
      </div>
      <div class="actions">
        <button id="likeBtn" class="btn primary">♥ Like <span id="count" class="badge">0</span></button>
        <button id="resetBtn" class="btn outline">Reset</button>
      </div>
    </section>

    <section class="card page" id="courses" hidden>
      <h1>My Courses</h1>
      <p class="course">This semester</p>
      <ul class="course-list">
        <li>Web System</li>
        <li>Object Oriented Programming</li>
        <li>Data Structures and algorithm</li>
      </ul>
    </section>

    <section class="card page" id="contact" hidden>
      <h1>Contact Us</h1>
      <p class="course">Send us a message</p>
      <input type="text" id="nameInput" class="field" placeholder="Your name">
      <input type="text" id="msgInput" class="field" placeholder="Your message">
      <button id="sendBtn" class="btn primary center">Send</button>
      <p id="status" class="status"></p>
    </section>
  </main>

  <footer>© 2026 CampusHub. All rights reserved.</footer>

  <script src="script.js"></script>
</body>
</html>
